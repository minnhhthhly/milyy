  <!doctype html>
  <html lang="vi">
    <head>
      <meta charset="UTF-8" />
      <title>Product Cards</title>
      <link rel="stylesheet" href="style.css" />
    </head>

    <body>
      <h1 align="center"><b>Shop thể thao<b></b></h1>
      <hr color="black" size="2" width="40%" />
      <p align="center" style="color: rgb(15, 15, 230);">shop thể thao cho người yêu thể thao :<</p>
      <div class="product-list">
        <div class="product">
          <img src="image/a1.png" alt="Sản phẩm 1" />
          <h2>áo thể thao</h2>
          <p class="price">150.000 VNĐ</p>
          <p class="description">áo thể thao</p>
          <button class="buy-button">Mua ngay</button>
          <button class="buy-button">Chi tiết</button>
        </div>

        <div class="product">
          <img src="image/a2.png" alt="Sản phẩm 2" />
          <h2>bộ quần áo thể thao</h2>
          <p class="price">249.000 VNĐ</p>
          <p class="description">bộ quần áo thể thao.</p>
          <button class="buy-button">Mua ngay</button>
          <button class="buy-button">Chi tiết</button>  
        </div>

        <div class="product">
          <img src="image/a3.png" alt="Sản phẩm 3" />
          <h2>giày thể thao</h2>
          <p class="price">1.290.000 VNĐ</p>
          <p class="description">giày thể thao.</p>
          <button class="buy-button">Mua ngay</button>
          <button class="buy-button">Chi tiết</button>
        
      </div>
      
          
          
        
     
      
    </body>
  </html>
